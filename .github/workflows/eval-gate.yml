name: lab9-eval-gate
on: [pull_request, workflow_dispatch]
permissions: {contents: read}
concurrency: {group: "eval-gate-${{ github.ref }}", cancel-in-progress: true}
jobs:
  # The starter repo has no src/lab8; its CI only runs after src/ of the Day 8 repo is copied into the fork.
  detect:
    runs-on: ubuntu-latest
    outputs: {lab8: "${{ steps.has.outputs.lab8 }}"}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - id: has
        run: "test -d src/lab8 && echo lab8=1 >> \"$GITHUB_OUTPUT\" || echo skip, overlay without src/lab8"

  eval-gate:
    needs: detect
    if: needs.detect.outputs.lab8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      EVAL_SPEC: config/metric_spec.yaml
      # Committed by the student after M4 (re-run on main, never hand-edited).
      EVAL_BASELINE: reports/baseline_v1.json
    defaults: {run: {working-directory: src}}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      # setup-uv publishes only full tags (no @v10); pin the SHA.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13", activate-environment: true, enable-cache: true, cache-dependency-glob: "src/requirements*.txt"}
      - run: uv pip install -r requirements.txt -r requirements-lab9.txt
      - name: Check Core environment
        run: python -m lab9.smoke
      - name: Run Core student tests
        run: python -m pytest -q -m student -o addopts= -k "lab9 and not advanced"
      - name: Validate eval set annotations
        run: python -m lab9.evalset --check
      - name: Verify M3 detection and false alarm rates
        run: python -m lab9.mutation --detect --spec "$EVAL_SPEC"
      - name: Evaluate and gate the PR swarm
        shell: bash
        run: |
          python -m lab9.eval --shape swarm --spec "$EVAL_SPEC" --out reports/eval_pr.json
          python -m lab9.gate --pr reports/eval_pr.json --baseline "$EVAL_BASELINE" --spec "$EVAL_SPEC"
      - name: Check the committed baseline and the M3 metric
        run: python -m lab9.ci_check --pr reports/eval_pr.json --baseline "$EVAL_BASELINE" --spec "$EVAL_SPEC"
      - name: Verify the gate accepts fixed
        shell: bash
        run: |
          python -m lab9.eval --shape fixed --spec "$EVAL_SPEC" --out reports/eval_fixed.json
          python -m lab9.gate --pr reports/eval_fixed.json --baseline "$EVAL_BASELINE" --spec "$EVAL_SPEC"
      - name: Verify the gate blocks seeded_regression
        shell: bash
        run: |
          python -m lab9.eval --shape seeded_regression --spec "$EVAL_SPEC" --out reports/eval_seeded_regression.json
          gate_status=0
          gate_output=$(python -m lab9.gate --pr reports/eval_seeded_regression.json --baseline "$EVAL_BASELINE" --spec "$EVAL_SPEC") || gate_status=$?
          printf '%s\n' "$gate_output"
          # A Python exception can also exit 1. Require the explicit pass_rate verdict.
          if [[ "$gate_status" -ne 1 ]] || ! grep -Eq '^exit 1 — blocked: ([^,]+, )*pass_rate(, |$)' <<< "$gate_output"; then
            echo "Expected the gate to block seeded_regression on pass_rate with exit 1 (got $gate_status)."
            exit 1
          fi

  # M5 is reviewable independently; the original complete M5-M7 job below stays strict.
  eval-gate-m5:
    needs: eval-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {PYTHONUTF8: "1"}
    defaults: {run: {working-directory: src}}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - id: has
        run: "test -f reports/baseline_v2.json && echo v2=1 >> \"$GITHUB_OUTPUT\" || echo skip, no baseline_v2"
      - if: steps.has.outputs.v2
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13", activate-environment: true, enable-cache: true, cache-dependency-glob: "src/requirements*.txt"}
      - if: steps.has.outputs.v2
        run: uv pip install -r requirements.txt -r requirements-lab9.txt
      - if: steps.has.outputs.v2
        name: Test M5 slices and v2 coverage
        run: python -m pytest -q -m student -o addopts= -k "m5 or slice_check"
      - if: steps.has.outputs.v2
        name: Validate v2 eval set
        run: python -m lab9.evalset --v2 --check
      - if: steps.has.outputs.v2
        name: Verify committed baseline and M5 variant gates
        run: python -m scripts.verify_m5 --check-committed

  # Advanced/Expert (M5-M7). Runs only once the student commits reports/baseline_v2.json, so a
  # Core-only submission stays green. Exit 1 = a survived mutant or a false alarm.
  eval-gate-v2:
    needs: eval-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {PYTHONUTF8: "1"}
    defaults: {run: {working-directory: src}}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - id: has
        run: "test -f reports/baseline_v2.json && echo v2=1 >> \"$GITHUB_OUTPUT\" || echo skip, no baseline_v2"
      - if: steps.has.outputs.v2
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {python-version: "3.13", activate-environment: true, enable-cache: true, cache-dependency-glob: "src/requirements*.txt"}
      - if: steps.has.outputs.v2
        run: uv pip install -r requirements.txt -r requirements-lab9.txt
      - if: steps.has.outputs.v2
        run: python -m pytest -q -m student -o addopts= -k advanced
      - if: steps.has.outputs.v2
        run: python -m lab9.evalset --v2
      - if: steps.has.outputs.v2
        name: Checkout trusted base for ratchet
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .ci-base
          persist-credentials: false
      - if: steps.has.outputs.v2
        name: Verify mutation scorecard and published-spec ratchet
        shell: bash
        run: |
          base_args=()
          # Freeze v2 policy once a v2 baseline has been published on the base branch.
          # A Core-only base has only an uncalibrated draft v2 spec, not a v2 baseline.
          if [[ -f ../.ci-base/src/reports/baseline_v2.json ]]; then
            base_args=(--base-spec ../.ci-base/src/config/metric_spec_v2.yaml)
          fi
          python -m lab9.mutation --spec config/metric_spec_v2.yaml --baseline reports/baseline_v2.json "${base_args[@]}"
      - if: steps.has.outputs.v2
        name: Verify A/A noise
        run: python -m lab9.mutation --spec config/metric_spec_v2.yaml --aa 66,77,88,99,110
      - if: steps.has.outputs.v2
        name: Verify integrity traps
        shell: bash
        run: |
          python -m lab9.eval --shape slice_regression --spec config/metric_spec_v2.yaml --out reports/eval_v2_slice_regression.json
          python -m lab9.traps --pr reports/eval_v2_slice_regression.json --baseline reports/baseline_v2.json --spec config/metric_spec_v2.yaml
      - if: steps.has.outputs.v2
        name: Verify additional M6 and M7 evidence
        run: python -m scripts.verify_m67
